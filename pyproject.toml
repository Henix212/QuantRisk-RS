[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "quantrisk-rs"
version = "0.1.0"
description = "High-performance risk, research & execution engine — Rust core, Python API"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
